<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Snipe Target Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: monospace;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 20px;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            margin: -20px 0 0 -20px;
            pointer-events: none;
            background: radial-gradient(circle, transparent 40%, red 41%, red 45%, transparent 46%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: red;
        }
        #crosshair::before { width: 2px; height: 100%; }
        #crosshair::after { width: 100%; height: 2px; }

        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border: 2px solid #555;
            border-radius: 10px;
            cursor: pointer;
        }
        h1 { margin-top: 0; color: #ff3333; }
    </style>
</head>
<body>

    <div id="ui">
        Score: <span id="score">0</span> | Ammo: <span id="ammo">10</span>
    </div>
    
    <div id="crosshair"></div>

    <div id="instructions">
        <h1>3D Sniper Range</h1>
        <p>Click to Play / Lock Mouse</p>
        <p><strong>Move Mouse</strong> to Aim | <strong>Left Click</strong> to Shoot<br><strong>R</strong> to Reload</p>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let score = 0, ammo = 10;
        let targets = [];
        let isPlaying = false;

        const scoreEl = document.getElementById('score');
        const ammoEl = document.getElementById('ammo');
        const instructions = document.getElementById('instructions');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b1d3a);
            scene.fog = new THREE.FogExp2(0x0b1d3a, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // Ground
            const floorGeo = new THREE.PlaneGeometry(500, 500);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a3a1a, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Build Environment (Simple distance pillars)
            for (let i = 0; i < 30; i++) {
                const height = 10 + Math.random() * 20;
                const pillarGeo = new THREE.BoxGeometry(4, height, 4);
                const pillarMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b });
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                pillar.position.set((Math.random() - 0.5) * 200, height / 2, -50 - Math.random() * 250);
                scene.add(pillar);
            }

            // Spawn Initial Targets
            for (let i = 0; i < 5; i++) {
                spawnTarget();
            }

            // Event Listeners
            instructions.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    isPlaying = true;
                    instructions.style.display = 'none';
                } else {
                    isPlaying = false;
                    instructions.style.display = 'block';
                }
            });

            let pitch = 0, yaw = 0;
            document.addEventListener('mousemove', (e) => {
                if (!isPlaying) return;
                const sensitivity = 0.002;
                yaw -= e.movementX * sensitivity;
                pitch -= e.movementY * sensitivity;

                pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));

                const quaternion = new THREE.Quaternion();
                const rotX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
                const rotY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                quaternion.multiplyQuaternions(rotY, rotX);
                camera.quaternion.copy(quaternion);
            });

            window.addEventListener('mousedown', () => {
                if (!isPlaying) return;
                shoot();
            });

            window.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') {
                    ammo = 10;
                    ammoEl.innerText = ammo;
                }
            });

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function spawnTarget() {
            const group = new THREE.Group();
            
            // Outer ring
            const outerGeo = new THREE.CylinderGeometry(2, 2, 0.2, 32);
            const outerMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const outer = new THREE.Mesh(outerGeo, outerMat);
            
            // Inner bullseye
            const innerGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.3, 32);
            const innerMat = new THREE.MeshStandardMaterial({ color: 0xffff00 });
            const inner = new THREE.Mesh(innerGeo, innerMat);

            outer.rotation.x = Math.PI / 2;
            inner.rotation.x = Math.PI / 2;
            
            group.add(outer);
            group.add(inner);

            // Random position downrange
            group.position.set(
                (Math.random() - 0.5) * 120,
                2 + Math.random() * 15,
                -40 - Math.random() * 200
            );

            scene.add(group);
            targets.push(group);
        }

        function shoot() {
            if (ammo <= 0) return;
            ammo--;
            ammoEl.innerText = ammo;

            // Flash effect simple screen jolt or color feedback could go here

            const raycaster = new THREE.Raycaster();
            const center = new THREE.Vector2(0, 0);
            raycaster.setFromCamera(center, camera);

            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                let hitObject = intersects[0].object;
                
                // Find parent target group
                let rootParent = hitObject;
                while (rootParent.parent && rootParent.parent !== scene) {
                    rootParent = rootParent.parent;
                }

                const index = targets.indexOf(rootParent);
                if (index > -1) {
                    score += 100;
                    scoreEl.innerText = score;
                    scene.remove(rootParent);
                    targets.splice(index, 1);
                    
                    // Respawn target after delay
                    setTimeout(spawnTarget, 1000);
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
