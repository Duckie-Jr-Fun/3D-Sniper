<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Rooftop Sniper</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050b14;
            font-family: monospace;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 20px;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 30px;
            height: 30px;
            margin: -15px 0 0 -15px;
            pointer-events: none;
            transition: width 0.2s, height: 0.2s, margin 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #crosshair.normal {
            background: radial-gradient(circle, transparent 40%, cyan 41%, cyan 45%, transparent 46%);
        }
        #crosshair.normal::before, #crosshair.normal::after {
            content: '';
            position: absolute;
            background: cyan;
        }
        #crosshair.normal::before { width: 2px; height: 100%; }
        #crosshair.normal::after { width: 100%; height: 2px; }

        /* Sniper Scope Overlay */
        #crosshair.scoped {
            width: 600px;
            height: 600px;
            margin: -300px 0 0 -300px;
            border-radius: 50%;
            border: 5px solid #111;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,20,0,0.8) 70%, #000 95%);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.85);
        }
        #crosshair.scoped::before, #crosshair.scoped::after {
            content: '';
            position: absolute;
            background: #00ff00;
        }
        #crosshair.scoped::before { width: 2px; height: 100%; }
        #crosshair.scoped::after { width: 100%; height: 2px; }

        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0,0,0,0.85);
            padding: 30px;
            border: 2px solid #3366cc;
            border-radius: 10px;
            cursor: pointer;
        }
        h1 { margin-top: 0; color: #4da6ff; }
        .badge { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui">
        Badge: <span class="badge">POLICE SNIPER</span> | Score: <span id="score">0</span> | Ammo: <span id="ammo">10</span> | Targets Left: <span id="targetsLeft">0</span>
    </div>
    
    <div id="crosshair" class="normal"></div>

    <div id="instructions">
        <h1>PD Rooftop Division</h1>
        <p>Eliminate the armed suspects hiding on the surrounding buildings.</p>
        <p><strong>Click to Start / Lock Mouse</strong></p>
        <p><strong>WASD / Arrows</strong> to Walk | <strong>Shift</strong> to Run<br><strong>Move Mouse</strong> to Aim | <strong>Right Click</strong> to Scope<br><strong>Left Click</strong> to Fire | <strong>R</strong> to Reload</p>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let score = 0, ammo = 10;
        let targets = [];
        let isPlaying = false;
        let isScoped = false;

        // Movement states
        const moveState = { forward: false, backward: false, left: false, right: false, shift: false };
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let pitch = 0, yaw = 0;

        const scoreEl = document.getElementById('score');
        const ammoEl = document.getElementById('ammo');
        const targetsLeftEl = document.getElementById('targetsLeft');
        const instructions = document.getElementById('instructions');
        const crosshairEl = document.getElementById('crosshair');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1118);
            scene.fog = new THREE.FogExp2(0x0a1118, 0.012);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            // Spawn player on top of a tall central police headquarters building
            camera.position.set(0, 32, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xddeeff, 0.4);
            scene.add(ambientLight);

            const moonLight = new THREE.DirectionalLight(0xaaccff, 0.6);
            moonLight.position.set(50, 100, 50);
            scene.add(moonLight);

            // Ground plane (Street level)
            const floorGeo = new THREE.PlaneGeometry(600, 600);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x11161d, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Build City Skyline / Rooftops
            buildCity();

            // Spawn Criminal Targets across rooftops
            spawnWave();

            // Event Listeners
            instructions.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    isPlaying = true;
                    instructions.style.display = 'none';
                } else {
                    isPlaying = false;
                    instructions.style.display = 'block';
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPlaying) return;
                const sensitivity = isScoped ? 0.0005 : 0.002;
                yaw -= e.movementX * sensitivity;
                pitch -= e.movementY * sensitivity;

                pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));

                updateCameraRotation();
            });

            window.addEventListener('mousedown', (e) => {
                if (!isPlaying) return;
                if (e.button === 0) { // Left Click - Shoot
                    shoot();
                } else if (e.button === 2) { // Right Click - Scope Toggle
                    e.preventDefault();
                    toggleScope();
                }
            });

            // Prevent context menu on right click
            window.addEventListener('contextmenu', e => e.preventDefault());

            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function buildCity() {
            const buildingMat = new THREE.MeshStandardMaterial({ color: 0x1b2430, roughness: 0.7 });
            const windowMat = new THREE.MeshBasicMaterial({ color: 0xffcc44 });

            // Player's rooftop platform
            const playerRoofGeo = new THREE.BoxGeometry(30, 2, 30);
            const playerRoofMat = new THREE.MeshStandardMaterial({ color: 0x2b3848 });
            const playerRoof = new THREE.Mesh(playerRoofGeo, playerRoofMat);
            playerRoof.position.set(0, 29, 0);
            scene.add(playerRoof);

            // Surroundings skyscrapers
            for (let i = 0; i < 45; i++) {
                const width = 15 + Math.random() * 25;
                const depth = 15 + Math.random() * 25;
                const height = 20 + Math.random() * 50;
                
                const bGeo = new THREE.BoxGeometry(width, height, depth);
                const building = new THREE.Mesh(bGeo, buildingMat);

                const angle = Math.random() * Math.PI * 2;
                const distance = 40 + Math.random() * 140;
                const x = Math.cos(angle) * distance;
                const z = Math.sin(angle) * distance;

                building.position.set(x, height / 2, z);
                scene.add(building);
            }
        }

        function spawnWave() {
            targets = [];
            const suspectCount = 6;
            for (let i = 0; i < suspectCount; i++) {
                spawnSuspect();
            }
            targetsLeftEl.innerText = targets.length;
        }

        function spawnSuspect() {
            const group = new THREE.Group();

            // Torso / Body (Dark clothes)
            const bodyGeo = new THREE.BoxGeometry(1.2, 2, 0.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x221111 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1;
            group.add(body);

            // Head
            const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xdc143c }); // Red accents / mask
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.3;
            group.add(head);

            // Weapon indicator
            const gunGeo = new THREE.BoxGeometry(0.2, 0.2, 1);
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
            const gun = new THREE.Mesh(gunGeo, gunMat);
            gun.position.set(0.6, 1.5, 0.5);
            group.add(gun);

            // Position randomly on surrounding rooftop heights
            const angle = Math.random() * Math.PI * 2;
            const distance = 50 + Math.random() * 120;
            const roofHeight = 15 + Math.random() * 40;

            group.position.set(
                Math.cos(angle) * distance,
                roofHeight,
                Math.sin(angle) * distance
            );

            scene.add(group);
            targets.push(group);
        }

        function toggleScope() {
            isScoped = !isScoped;
            if (isScoped) {
                crosshairEl.className = 'scoped';
                camera.fov = 15; // Zoom in
            } else {
                crosshairEl.className = 'normal';
                camera.fov = 60; // Normal view
            }
            camera.updateProjectionMatrix();
        }

        function updateCameraRotation() {
            const quaternion = new THREE.Quaternion();
            const rotX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
            const rotY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            quaternion.multiplyQuaternions(rotY, rotX);
            camera.quaternion.copy(quaternion);
        }

        function handleKey(e, isDown) {
            switch (e.code) {
                case 'KeyW': case 'ArrowUp': moveState.forward = isDown; break;
                case 'KeyS': case 'ArrowDown': moveState.backward = isDown; break;
                case 'KeyA': case 'ArrowLeft': moveState.left = isDown; break;
                case 'KeyD': case 'ArrowRight': moveState.right = isDown; break;
                case 'ShiftLeft': case 'ShiftRight': moveState.shift = isDown; break;
                case 'KeyR':
                    if (isDown) {
                        ammo = 10;
                        ammoEl.innerText = ammo;
                    }
                    break;
            }
        }

        function shoot() {
            if (ammo <= 0) return;
            ammo--;
            ammoEl.innerText = ammo;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                let hitObject = intersects[0].object;
                
                let rootParent = hitObject;
                while (rootParent.parent && rootParent.parent !== scene) {
                    rootParent = rootParent.parent;
                }

                const index = targets.indexOf(rootParent);
                if (index > -1) {
                    score += 150;
                    scoreEl.innerText = score;
                    scene.remove(rootParent);
                    targets.splice(index, 1);
                    targetsLeftEl.innerText = targets.length;
                    
                    if (targets.length === 0) {
                        setTimeout(spawnWave, 1500);
                    }
                }
            }
        }

        function updateMovement(delta) {
            if (!isPlaying) return;

            const speed = (moveState.shift ? 18 : 9) * delta;
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveState.forward) - Number(moveState.backward);
            direction.x = Number(moveState.right) - Number(moveState.left);
            direction.normalize();

            if (moveState.forward || moveState.backward) velocity.z -= direction.z * speed * 10;
            if (moveState.left || moveState.right) velocity.x -= direction.x * speed * 10;

            const moveDirZ = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            const moveDirX = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            camera.position.addScaledVector(moveDirZ, -velocity.z * delta);
            camera.position.addScaledVector(moveDirX, -velocity.x * delta);

            // Restrict movement to central police roof bounds (-12 to 12)
            camera.position.x = Math.max(-12, Math.min(12, camera.position.x));
            camera.position.z = Math.max(-12, Math.min(12, camera.position.z));
            camera.position.y = 32; // Lock height to rooftop
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            updateMovement(delta);

            prevTime = time;
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
