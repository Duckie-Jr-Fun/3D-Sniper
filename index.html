<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1v1 Arena - Improved</title>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; width: 100%; height: 100%; pointer-events: none; }
        
        #crosshair { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: white; font-size: 30px; font-weight: bold; text-shadow: 2px 2px 2px black; 
        }
        
        #startButton { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            padding: 20px 40px; font-size: 24px; font-weight: bold; cursor: pointer; 
            pointer-events: auto; background-color: #ff4747; color: white; border: none; 
            border-radius: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s;
        }
        
        #startButton:hover { background-color: #ff2a2a; transform: translate(-50%, -52%); }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <div id="crosshair">+</div>
        <button id="startButton">Click to Play</button>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
